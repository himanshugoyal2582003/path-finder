# render.yaml — Render Blueprint for Antigravity PathFinder
# Deploy both backend services in one click at render.com/blueprints

services:
  # ── AI Service (FastAPI / LangGraph) ──────────────────────────────────────
  - type: web
    name: pathfinder-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    
     

  # ── Express Backend ────────────────────────────────────────────────────────
  - type: web
    name: pathfinder-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure random value
      - key: AI_SERVICE_URL
        fromService:
          name: pathfinder-ai
          type: web
          property: host            # Render auto-links the AI service URL
